<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ctrl-F dev test</title>
<!-- Throwaway test page. Remove the dev-test/ folder when the real UI exists. -->
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  h2 { margin-top: 0; font-size: 1.1rem; }
  button, input, textarea { font: inherit; padding: .4rem .7rem; }
  textarea { width: 100%; box-sizing: border-box; }
  video { width: 100%; background: #000; border-radius: 4px; }
  .out { margin-top: .6rem; color: #333; white-space: pre-wrap; }
  .err { color: #b00020; }
</style>
</head>
<body>
<h1>Ctrl-F dev test</h1>

<section>
  <h2>Speech to text (browser mic)</h2>
  <button id="rec">Hold to record</button>
  <div class="out" id="stt-out">Hold the button, speak, release.</div>
</section>

<section>
  <h2>Text to speech (British voice)</h2>
  <textarea id="tts-text" rows="2">Splendid news! Your keys are resting upon the mahogany desk.</textarea>
  <button id="speak">Speak</button>
  <div class="out" id="tts-out"></div>
</section>

<section>
  <h2>Collect training photos (webcam)</h2>
  <video id="cam" autoplay playsinline muted></video>
  <p>
    <input id="item" value="keys" size="12" aria-label="Item class">
    <button id="snap">Save photo</button>
  </p>
  <div class="out" id="collect-out"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
const show = (id, text, isError = false) => { const el = $(id); el.textContent = text; el.className = "out" + (isError ? " err" : ""); };

// Speech to text: record while the button is held, then post the clip.
let recorder, chunks = [];
async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      show("stt-out", "Transcribing...");
      const res = await fetch("/api/stt", { method: "POST", body: new Blob(chunks, { type: recorder.mimeType }) });
      const data = await res.json();
      res.ok ? show("stt-out", `"${data.text}"  (${data.seconds}s)`) : show("stt-out", data.error, true);
    };
    recorder.start();
    show("stt-out", "Recording...");
  } catch (err) {
    show("stt-out", `Mic unavailable: ${err.message}`, true);
  }
}
const stopRecording = () => recorder && recorder.state === "recording" && recorder.stop();
$("rec").addEventListener("mousedown", startRecording);
$("rec").addEventListener("mouseup", stopRecording);
$("rec").addEventListener("mouseleave", stopRecording);

// Text to speech
$("speak").addEventListener("click", async () => {
  show("tts-out", "Speaking...");
  const res = await fetch("/api/tts", { method: "POST", body: JSON.stringify({ text: $("tts-text").value }) });
  if (!res.ok) return show("tts-out", (await res.json()).error, true);
  new Audio(URL.createObjectURL(await res.blob())).play();
  show("tts-out", "Played.");
});

// Webcam: preview, and save a JPEG to datasets/ctrlf/raw/<item>/ on the server.
navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => { $("cam").srcObject = stream; })
  .catch((err) => show("collect-out", `Camera unavailable: ${err.message}`, true));
$("snap").addEventListener("click", () => {
  const video = $("cam");
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  canvas.toBlob(async (blob) => {
    const res = await fetch(`/api/collect?item=${encodeURIComponent($("item").value)}`, { method: "POST", body: blob });
    const data = await res.json();
    res.ok ? show("collect-out", `Saved. ${data.count} photos of ${data.item}.`) : show("collect-out", data.error, true);
  }, "image/jpeg", 0.92);
});
</script>
</body>
</html>
