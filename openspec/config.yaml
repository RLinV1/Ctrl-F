schema: spec-driven

context: |
  Project: Ctrl-F. Finds lost physical items. Voice request -> Raspberry Pi photo ->
  Hermes image analysis from a processing worker -> stored sighting (snapshot + Postgres row) -> spoken answer.
  Read docs/PRD.md, docs/ARCHITECTURE.md, docs/TECH_STACK.md before proposing changes.
  Components: web/ (Next.js on Vercel), desktop/ (Python S3 polling worker, Hermes HTTP adapter), pi/ (Python, Logitech webcam camera/mic + relay; browser mic for web requests).
  Stack: Next.js + TypeScript, Vercel, GoDaddy domain, Gemini (Victorian narration and retained target-picking fallback; no image analysis), ElevenLabs, Hermes Agent (configured vision provider, read-only Postgres MCP history tool),
  Postgres, S3-compatible storage (R2 default; SeaweedFS possible).
  Constraints: Vercel never calls the desktop or Pi (Pi polls S3 jobs/ and uploads incoming/ photos; processing worker polls photos and writes Postgres/results; device audio is posted outbound to web).
  Snapshots are private (signed URLs). No secrets in the repo.
  Conventions: Conventional Commits, branches named type/short-slug, no Co-Authored-By trailers.

rules:
  proposal:
    - Reference the PRD requirement IDs (F1..F10) the change implements.
    - Include a Non-goals section.
  tasks:
    - Keep tasks small enough for one PR.
    - Include a test or manual check task for non-trivial logic.
    - Any task that changes the website includes a Playwright test task (web/e2e/).
    - Include a task to update docs/ when contracts or schema change.
